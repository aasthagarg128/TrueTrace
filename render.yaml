# Render Blueprint. Connect this repo at dashboard.render.com > New >
# Blueprint, and Render reads this file to provision all three services.
#
# Three services, not two: the deepfake classifier (truetrace-detector) and
# identity matching (truetrace-identity) started as one combined service and
# were split once their combined memory footprint exceeded Render's free
# 512MB limit - see services/identity/app/identity.py for the measurements.
#
# Env vars marked `sync: false` are secrets or per-deploy values Render will
# prompt for once, on first deploy, rather than storing here in plain text -
# see docs/deployment.md for exactly which value goes where.
services:
  - type: web
    name: truetrace-detector
    runtime: docker
    plan: free
    rootDir: services/detector
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DETECTOR_SHARED_SECRET
        generateValue: true  # copy into truetrace-api's own var of the same
                              # name - services don't share env vars

  - type: web
    name: truetrace-identity
    runtime: docker
    plan: free
    rootDir: services/identity
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: IDENTITY_SHARED_SECRET
        generateValue: true  # copy into truetrace-api's own var of the same name

  - type: web
    name: truetrace-api
    runtime: docker
    plan: free
    rootDir: services/agents
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DETECTOR_URL
        sync: false  # truetrace-detector's Render URL
      - key: DETECTOR_SHARED_SECRET
        sync: false  # SAME value truetrace-detector generated
      - key: IDENTITY_URL
        sync: false  # truetrace-identity's Render URL
      - key: IDENTITY_SHARED_SECRET
        sync: false  # SAME value truetrace-identity generated
      - key: EVIDENCE_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CASE_BACKEND
        value: firestore
      - key: GOOGLE_CLOUD_PROJECT
        value: truetrace-508211
      - key: FIRESTORE_COLLECTION
        value: cases
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firestore-key.json  # path Render mounts a
                                                 # "Secret File" at - see
                                                 # docs/deployment.md
      - key: ALLOWED_ORIGINS
        sync: false  # the deployed Netlify site's URL, once known
